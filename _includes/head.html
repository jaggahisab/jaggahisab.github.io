<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="google-site-verification" content="EFltJvHk7Kgc_6KrnGAq5Vq1WM_yOMxBGyHeEvffp3U">
{%- if page.title -%}
  <title>{{ page.title }} | {{ site.title }}</title>
{%- else -%}
  <title>{{ site.title }} — {{ site.description }}</title>
{%- endif -%}
{%- if page.description -%}
  <meta name="description" content="{{ page.description }}">
{%- endif -%}
{%- if page.canonical -%}
  <link rel="canonical" href="{{ page.canonical | absolute_url }}">
{%- else -%}
  <link rel="canonical" href="{{ page.url | absolute_url }}">
{%- endif -%}
<meta name="robots" content="index, follow">
<meta property="og:title" content="{{ page.title | default: site.title }}">
<meta property="og:description" content="{{ page.description | default: site.description }}">
<meta property="og:type" content="website">
<meta property="og:url" content="{{ page.url | absolute_url }}">
{%- if page.faq -%}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {%- if page.canonical -%}
    {"@type":"BreadcrumbList","itemListElement":[
      {"@type":"ListItem","position":1,"name":"गृहपृष्ठ","item":"{{ '/' | absolute_url }}"},
      {"@type":"ListItem","position":2,"name":"{{ page.category_label | default: 'क्यालकुलेटर' }}","item":"{{ page.category_hub | default: '/' | absolute_url }}"},
      {"@type":"ListItem","position":3,"name":"{{ page.title }}","item":"{{ page.canonical | absolute_url }}"}
    ]},
    {%- endif -%}
    {"@type":"FAQPage","mainEntity":[
      {%- for f in page.faq -%}
      {"@type":"Question","name":{{ f.q | jsonify }},"acceptedAnswer":{"@type":"Answer","text":{{ f.a | jsonify }}}}{% unless forloop.last %},{% endunless %}
      {%- endfor -%}
    ]}
  ]
}
</script>
{%- endif -%}
